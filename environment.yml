name: dexmirror
channels:
  - conda-forge
dependencies:
  - python=3.8.20
  - pip=24.2
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.0.0+cu118
    - torchvision==0.15.1+cu118
    - numpy==1.24.1
    - plyfile==1.0.3
    - Pillow==10.2.0
    - opencv-python==4.11.0.86
    - joblib==1.4.2
    - tqdm==4.67.1
    - setuptools==75.1.0
    - wheel==0.45.1
    - ninja
# Install the three local CUDA extensions after creating this environment.
# A CUDA 11.8 toolkit (including nvcc) is required separately; see README.md.
